name: Bug report
description: Something in ProviderEnhance does not work as documented
title: 'bug: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: |
        Please remove API keys and account names from logs and screenshots.
        Running `node scripts/doctor.mjs --profile desktop` first usually makes
        the report much faster to answer.
  - type: input
    id: dsh-version
    attributes:
      label: DSH version
      description: From the DSH About dialog or `resources/app.asar/package.json`.
      placeholder: 0.2.1-rc.3
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: ProviderEnhance version
      placeholder: 0.2.1
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Where does it fail?
      options:
        - Install / uninstall script
        - Models page (configuration list, editor, save)
        - Model discovery (Fetch models)
        - Chat model list grouping
        - Adapter loading / startup
        - Something else
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Settings → Models → OpenCode Go
        2. Add configuration …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the visible error text (red line under a configuration, startup error, terminal output).
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: Redacted `llm-pi-ai` configuration
      description: Copy the `providers:` block from the profile's `cordis.patch.yml`, replacing key names with placeholders.
      render: yaml
  - type: textarea
    id: doctor
    attributes:
      label: `node scripts/doctor.mjs --profile desktop` output
      description: Copy the whole report; it contains no API keys.
      render: text
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11 26200
  - type: checkboxes
    id: checks
    attributes:
      label: Confirmations
      options:
        - label: I removed API keys and account names from everything I pasted.
          required: true
        - label: I am running a supported DSH version (0.2.1-rc.3) or said which one I use.
          required: true
