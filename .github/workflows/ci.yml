name: ci

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Offline checks
        run: node scripts/check.mjs
      - name: Header tests (skipped without a DSH install)
        run: node --test tests/headers.test.mjs
